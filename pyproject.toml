[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-service-android-node"
version = "0.1.0"
description = "Android setup and webpage-node relay service for urirun on port 8195"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "if-uri" }]
dependencies = ["urirun[host]>=0.4.88", "qrcode[pil]>=7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://connect.ifuri.com/services/android-node"
Repository = "https://github.com/if-uri/urirun-service-android-node"

[project.scripts]
urirun-service-android-node = "urirun_service_android_node.core:main"
urirun-android-node = "urirun_service_android_node.core:main"

[project.entry-points."urirun.services"]
android-node = "urirun_service_android_node.core:urirun_service"

[tool.setuptools.packages.find]
where = ["."]
include = ["urirun_service_android_node*"]

[tool.setuptools.package-data]
urirun_service_android_node = ["service.manifest.json", "templates/*.html"]
